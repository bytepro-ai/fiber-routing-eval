name: Lean source manifest

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check-lean-source-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Lean source-anchor manifest
        run: python3 tools/check_lean_source_manifest.py
